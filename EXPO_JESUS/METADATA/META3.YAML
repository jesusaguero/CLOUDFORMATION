Resources:
  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Metadata:
      Author: "Jesus Agüero"
      LastUpdated: "2025-03-07"
      Description: "Lambda para procesar eventos de S3"
    Properties:
      FunctionName: "ProcessS3Events"
      Runtime: python3.8
      Handler: index.lambda_handler
      Role: arn:aws:iam::123456789012:role/MyLambdaRole
      Code:
        S3Bucket: my-lambda-code
        S3Key: lambda.zip
