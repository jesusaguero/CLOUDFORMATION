AWSTemplateFormatVersion: '2010-09-09'
Description: "Ejemplo de User Data para instalar Apache en EC2"

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-09e67e426f25ce0d7  # Amazon Linux 2 (us-east-1)
      KeyName: my-key-pair
      SecurityGroups:
        - !Ref MySecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hola desde EC2</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: "Servidor Web"

  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Permitir tráfico HTTP"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0  # Acceso público a la web

Outputs:
  PublicIP:
    Description: "Dirección IP Pública de la instancia"
    Value: !GetAtt MyEC2Instance.PublicIp
