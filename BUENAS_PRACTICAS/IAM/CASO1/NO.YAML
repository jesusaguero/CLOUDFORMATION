Resources:
  MyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-123456
      InstanceType: t2.micro
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          aws s3 cp s3://my-bucket/myfile.txt /home/ec2-user/ --access-key MYACCESSKEY --secret-key MYSECRETKEY
